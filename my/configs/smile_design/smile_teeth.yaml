# 치아 전용 기본 스타일 (미백 / 교정). docs/smile_tune/experiments.md 10장 결과 기반.
# 권장 요청:
#   미백만:      {"mode": "preset", "preset": "whitening_only", "mask": {"regions": ["teeth", "inner_mouth"], "dilate": 3, "feather": 4}}
#   교정:        {"mode": "preset", "preset": "align_only",     "mask": {"regions": ["mouth"], "dilate": 16, "feather": 12}}
#   교정 + 미백: {"mode": "preset", "preset": "align_whiten",   "mask": {"regions": ["mouth"], "dilate": 16, "feather": 12}}
# 주의: tooth_color를 delta 강도 x3 이상으로 쓰면 입술이 푸르게 변하는 아티팩트가 생긴다.
version: 1
template_version: smile-teeth-v1
base_template: |-
  Edit image 1, a photo of this person. {reference_instructions}
  Keep exactly the same person: face shape, facial proportions, eye shape, nose, skin tone, age, hairstyle, and accessories.
  Keep the head pose, facial expression, mouth opening, lips, lighting, clothing, and background exactly as in image 1.
  Tooth alignment: {alignment}
  Tooth color: {tooth_color}
  Do not add, remove, enlarge, or reshape any tooth beyond the requested change. Keep the result anatomically plausible and photorealistic.
layouts:
  patient_only:
    roles: [patient]
    instruction: Apply only the changes listed below.
  patient_tooth:
    roles: [patient, tooth]
    instruction: Apply only the changes listed below. Use image 2 only as a reference for tooth shape, proportions, and arrangement.
controls:
  tooth_color:
    default: 0
    anchors:
      "0": keep the exact original tooth color
      "25": change only the color to a slightly brighter natural shade
      "50": change only the color to a natural white shade
      "75": change only the color to a bright white shade
      "100": change only the color to a very bright cosmetic white shade
  alignment:
    default: 0
    anchors:
      "0": keep every tooth's shape, size, position, gaps, and arrangement exactly as in image 1
      "25": move only the single most crooked or protruding tooth slightly back toward the dental arch
      "50": move only the crooked, overlapping, or protruding teeth, such as a snaggletooth, back into line with the neighboring teeth
      "75": straighten all crooked, overlapping, and protruding teeth into an even dental arch, like after orthodontic treatment
      "100": straighten all crooked, overlapping, and protruding teeth into a neat, even, symmetric dental arch, like after complete orthodontic treatment
presets:
  natural: {}
  whitening_natural:
    tooth_color: 50
  whitening_only:
    tooth_color: 100
  align_snaggle:
    alignment: 50
  align_only:
    alignment: 100
  align_whiten:
    alignment: 100
    tooth_color: 75
grids:
  align_color:
    attributes: [alignment, tooth_color]
